name: Package and publish plugin release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Validate release version and manifests
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH, got: $RELEASE_TAG" >&2
            exit 1
          fi

          RELEASE_VERSION="${RELEASE_TAG#v}"
          PLUGIN_VERSION="$(jq -r '.version // empty' plugin.json)"
          CLAUDE_PLUGIN_VERSION="$(jq -r '.version // empty' .claude-plugin/plugin.json)"
          OPENAI_MARKETPLACE_VERSION="$(jq -r '.plugins[0].version // empty' .agents/plugins/marketplace.json)"
          CLAUDE_MARKETPLACE_VERSION="$(jq -r '.metadata.version // empty' .claude-plugin/marketplace.json)"

          test "$PLUGIN_VERSION" = "$RELEASE_VERSION"
          test "$CLAUDE_PLUGIN_VERSION" = "$RELEASE_VERSION"
          test "$OPENAI_MARKETPLACE_VERSION" = "$RELEASE_VERSION"
          test "$CLAUDE_MARKETPLACE_VERSION" = "$RELEASE_VERSION"
          jq -e . mcp.json >/dev/null
          jq -e . .mcp.json >/dev/null
          jq -e . .agents/plugins/marketplace.json >/dev/null
          jq -e . .claude-plugin/marketplace.json >/dev/null

      - name: Build and verify plugin archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          PACKAGE_PATH="dist/zuno-learning-${RELEASE_TAG}.zip"
          zip -q -r "$PACKAGE_PATH" \
            plugin.json \
            mcp.json \
            .mcp.json \
            .claude-plugin/plugin.json \
            skills/
          unzip -t "$PACKAGE_PATH"
          sha256sum "$PACKAGE_PATH" > "$PACKAGE_PATH.sha256"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_PATH="dist/zuno-learning-${RELEASE_TAG}.zip"
          CHECKSUM_PATH="$PACKAGE_PATH.sha256"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$PACKAGE_PATH" "$CHECKSUM_PATH" --clobber
          else
            gh release create "$RELEASE_TAG" "$PACKAGE_PATH" "$CHECKSUM_PATH" \
              --title "Zuno Learning ${RELEASE_TAG}" \
              --generate-notes
          fi
